<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Asset Stamped Successfully - Fair Judgment Ledger</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px 20px; margin: 0; }
    .card { max-width: 700px; margin: 0 auto; background-color: #161b22; padding: 40px; border-radius: 8px; border: 1px solid #238636; box-shadow: 0 0 15px rgba(35,134,54,0.15); }
    .header { text-align: center; margin-bottom: 30px; }
    .icon { font-size: 50px; margin-bottom: 10px; display: block; }
    h1 { color: #3fb950; margin: 0; font-size: 28px; }
    p.tag { color: #8b949e; margin: 5px 0 0 0; font-size: 14px; }
    .data-box { background: #0d1117; border: 1px solid #30363d; padding: 20px; border-radius: 6px; margin-bottom: 30px; }
    p.line { margin: 0 0 12px 0; font-size: 15px; line-height: 1.4; }
    strong { color: #8b949e; font-weight: 500; }
    label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
    .code-block { background: #161b22; padding: 15px; border-radius: 4px; border: 1px solid #21262d; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; color: #e6edf3; line-height: 1.6; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #30363d; padding-top: 20px; margin-top: 10px; }
    a { color: #8b949e; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    a:hover { color: #58a6ff; }
    button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background-color 0.2s, color 0.2s; }
    button:hover { background: #30363d; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="icon">🔒</span>
      <h1>Asset Stamped Successfully</h1>
      <p class="tag">Fair Judgment Ledger Isolation Verified</p>
    </div>
    <div class="data-box">
      <p class="line"><strong>Asset Holder:</strong> <span id="authorOut"></span></p>
      <p class="line"><strong>Title Spec:</strong> <span id="titleOut"></span></p>
      <p class="line"><strong>Committed Temporal Marker:</strong> <span id="timeOut"></span></p>
      <label>Protected Input String Baseline</label>
      <div id="genesisOut" class="code-block"></div>
    </div>
    <div class="footer">
      <a href="/portal">← Log Out Session</a>
      <button onclick="window.print()">📄 Print Local Copy</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('authorOut').innerText = params.get('author') || 'N/A';
    document.getElementById('titleOut').innerText = params.get('title') || 'N/A';
    document.getElementById('timeOut').innerText = params.get('timestamp') || 'N/A';
    document.getElementById('genesisOut').innerText = params.get('genesis') || 'No genesis baseline string recorded.';
  </script>
</body>
</html>
