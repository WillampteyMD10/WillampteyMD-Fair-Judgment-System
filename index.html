    <script src="./supabase.js"></script>

    <script>
        // 2. Core Supabase Platform Configuration Credentials
     const supabaseUrl = "https://cbqkkipipssgplwbuqrm.supabase.co";
        const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicWtraXBpcHNzZ3Bsd2J1cXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTA3NjEsImV4cCI6MjEwMTY2Njc2MX0.b4coHxXwK9L8XIq6moXH4GNcSb2uk6eeKE7hPO2Ra-M";
        
        // Use the safe constructor object injected by your local file asset
        const supabaseConstructor = window.supabase || window.supabaseJs;
        const supabase = supabaseConstructor.createClient(supabaseUrl, supabaseAnonKey);

        // 3. Helper utility to clean up custom view logs
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ 
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' 
            }[tag] || tag));
        }

        // 4. Database Reader (Fetches cases from active database matrix)
        async function loadCasesFromDatabase() {
            const container = document.getElementById('casesDisplayContainer');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('cases')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(10);

                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = "<p class='text-gray-500 text-sm p-3 text-center'>No certified records found yet.</p>";
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="p-3 border-b border-gray-100 last:border-b-0 text-left">
                        <div class="font-semibold text-gray-800 text-sm">${escapeHTML(item.title) || 'Untitled Asset'}</div>
                        <div class="text-xs text-gray-500">Author: ${escapeHTML(item.author) || 'Unknown'}</div>
                        <p class="text-xs text-gray-600 mt-1 italic">"${escapeHTML(item.human_genesis) || 'No core layout logged.'}"</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Database Reader Error:", err.message);
            }
        }

        // 5. Connect Intent Certification Handler directly to your main interactive button
        document.addEventListener('DOMContentLoaded', () => {
            loadCasesFromDatabase(); // Call history on launch

            const certifyBtn = document.getElementById('certifyButton');
            
            if (certifyBtn) {
                certifyBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    
                    // 🟩 FORCE COLOR TO TURN GREEN INSTANTLY ON INTERACTION CLICK
                    certifyBtn.style.backgroundColor = '#22c55e'; 
                    certifyBtn.style.color = '#ffffff';
                    certifyBtn.innerText = 'Processing Certification...';

                    try {
                        const titleInput = document.getElementById('projectTitle')?.value || '';
                        const authorInput = document.getElementById('authorName')?.value || '';
                        const genesisInput = document.getElementById('humanGenesis')?.value || '';

                        const { data, error } = await supabase
                            .from('cases')
                            .insert([
                                { 
                                    title: titleInput, 
                                    author: authorInput, 
                                    human_genesis: genesisInput 
                                }
                            ]);

                        if (error) throw error;
                        
                        certifyBtn.innerText = '🛡️ Certified & Protected!';
                        
                        const form = document.getElementById('judgmentForm');
                        if (form) form.reset();

                        await loadCasesFromDatabase(); // Refresh timeline view

                    } catch (err) {
                        console.error("Database Save Failed:", err.message);
                        certifyBtn.style.backgroundColor = '#ef4444'; // Turns Red on table insert block
                        certifyBtn.innerText = `Error: ${err.message || 'Submission Blocked'}`;
                    }
                });
            }
        });
    </script>
</body>
