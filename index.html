    <script>
        // 1. Integrated Database Wrapper Module (Completely bypasses all external CDN blocks)
        (function(global) {
            var SupabaseClient = function(url, key) {
                this.url = url;
                this.key = key;
            };
            SupabaseClient.prototype.from = function(tableName) {
                var self = this;
                var headers = {
                    'apikey': self.key,
                    'Authorization': 'Bearer ' + self.key,
                    'Content-Type': 'application/json'
                };
                return {
                    select: function() {
                        return {
                            order: function() {
                                return {
                                    limit: function() {
                                        return fetch(self.url + '/rest/v1/' + tableName + '?select=*', {
                                            method: 'GET',
                                            headers: headers
                                        }).then(function(r) { return r.json().then(function(d) { return { data: d, error: !r.ok ? d : null }; }); });
                                    }
                                };
                            }
                        };
                    },
                    insert: function(payloadArray) {
                        return fetch(self.url + '/rest/v1/' + tableName, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(payloadArray)
                        }).then(function(r) { 
                            if (r.status === 201 || r.ok) {
                                return { data: payloadArray, error: null };
                            }
                            return r.json().then(function(d) { return { data: null, error: d }; });
                        });
                    }
                };
            };
            global.customSupabaseEngine = {
                createClient: function(url, key) {
                    return new SupabaseClient(url, key);
                }
            };
        })(window);

        // 2. Core Supabase configuration parameters
        const supabaseUrl = "https://cbqkkipipssgplwbuqrm.supabase.co";
        const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNicWtraXBpcHNzZ3Bsd2J1cXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTA3NjEsImV4cCI6MjEwMTY2Njc2MX0.b4coHxXwK9L8XIq6moXH4GNcSb2uk6eeKE7hPO2Ra-M";

        // Initialize natively from the custom local engine module
        const supabase = window.customSupabaseEngine.createClient(supabaseUrl, supabaseAnonKey);

        // 3. Helper function to safely escape HTML data view layouts
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ 
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' 
            }[tag] || tag));
        }

        // 4. Form Submit Handler (Saves user intake details to database)
        document.getElementById('judgmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusNotification');
            
            btn.innerText = "Processing Equilibrium Array...";
            btn.style.backgroundColor = "#151f32";
            btn.style.color = "#ffffff";

            statusBox.style.display = "block";
            statusBox.style.background = "#151f32";
            statusBox.style.color = "#ffffff";
            statusBox.innerText = "Transmitting certified human spark via integrated layer...";

            const payload = {
                title: document.getElementById('projectTitle').value,
                creator: document.getElementById('creatorName').value,
                human_genesis: document.getElementById('humanGenesis').value,
                worker_ai_use: document.getElementById('workerAI').value,
                detective_ai_accusation: document.getElementById('detectiveVerdict').value
            };

            try {
                const { data, error } = await supabase
                    .from('cases')
                    .insert([payload]);

                if (error) throw error;

                // 🟩 FORCE THE BUTTON AND STATUS NOTIFICATION GREEN INSTANTLY
                btn.style.backgroundColor = '#22c55e'; 
                btn.style.color = '#ffffff';
                btn.innerText = '🛡️ Certified & Protected!';

                statusBox.style.background = "#064e3b";
                statusBox.style.color = "#4ade80";
                statusBox.innerText = "✅ Human Genesis Certified! Case safely logged in the Fair Judgment matrix.";
                
                // Fire your custom alert timestamp notification
                alert("Genesis Proof Captured! Your idea is officially timestamped.");

                document.getElementById('judgmentForm').reset();
                await loadCasesFromDatabase();

            } catch (error) {
                btn.style.backgroundColor = 'var(--accent-blue)'; 
                btn.style.color = '#0b0f19';
                btn.innerText = "Certify and Protect Intent Layer";

                statusBox.style.background = "#7f1d1d";
                statusBox.style.color = "#f87171";
                statusBox.innerText = `❌ System Block: ${error.message || 'Handshake rejected'}`;
                console.error("SDK Execution Trace:", error);
            }
        });

        // 5. Database Content Reader Engine (Fetches and renders logs)
        async function loadCasesFromDatabase() {
            const container = document.getElementById('casesDisplayContainer');
            if (!container) return;
            
            try {
                const { data, error } = await supabase
                    .from('cases')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(10);

                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = `<p style='color: #64748b; text-align: center; padding: 40px 0;'>Database empty. Ready for human entries.</p>`;
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="case-item">
                        <div class="case-header">
                            <span>Asset: ${escapeHTML(item.title) || 'Untitled'}</span>
                            <span style="font-size: 0.8rem; color: #64748b;">Author: ${escapeHTML(item.creator) || 'Unknown'}</span>
                        </div>
                        <div class="case-section">
                            <span class="section-title" style="color: var(--accent-green);">1. Human Genesis Baseline:</span>
                            <p style="margin: 2px 0 0 0; font-style: italic;">${escapeHTML(item.human_genesis) || 'None provided.'}</p>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Database Reader Error:", err.message);
            }
        }

        // Initialize listener anchors on document launch mount
        document.addEventListener('DOMContentLoaded', () => {
            loadCasesFromDatabase();
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', loadCasesFromDatabase);
            }
        });
    </script>
</body>
</html>
