<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multi Timezone Digital Clock</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --accent:#60a5fa; --muted:#94a3b8; --glass:rgba(255,255,255,0.03);
      --radius:12px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071128 0%, #07121a 100%);color:#e6eef8}
    .app{max-width:960px;margin:32px auto;padding:24px;background:var(--glass);border-radius:16px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:1.25rem;color:var(--accent)}
    p.lead{margin:0;color:var(--muted);font-size:0.95rem}
    .controls{Display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
    input[type="text"]{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#071427;color:inherit}
    button{padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#052036;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));padding:14px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02)}
    .tz-name{font-weight:700;color:#dbeafe}
    .tz-offset{color:var(--muted);font-size:0.9rem}
    .time{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Noto Mono", monospace; font-size:1.45rem;margin-top:8px}
    .controls-row{display:flex;gap:8px;align-items:center}
    .small{font-size:0.85rem;color:var(--muted)}
    .remove{background:transparent;border:0;color:#ff8b8b;cursor:pointer;font-weight:700}
    footer{margin-top:20px;color:var(--muted);font-size:0.85rem}
    .error{color:#ffb4b4;margin-left:8px}
    @media (max-width:520px){ .time{font-size:1.15rem} }
  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <div>
        <h1>Multi Timezone Digital Clock</h1>
        <p class="lead">Displays the current time in several time zones. Add IANA timezones (e.g., America/New_York)</p>
      </div>
      <div class="small">Local: <strong id="local-zone"></strong></div>
    </header>

    <section class="controls" aria-hidden="false">
      <div class="controls-row">
        <input id="tz-input" type="text" placeholder="Enter IANA timezone (e.g. Asia/Tokyo)" aria-label="Timezone input" />
        <button id="add-btn">Add timezone</button>
        <button id="add-common" class="secondary">Add common set</button>
        <span id="err" class="error" aria-live="polite"></span>
      </div>
      <div class="controls-row" style="margin-left:4px;">
        <label class="small" for="format-toggle">24-hour</label>
        <input id="format-toggle" type="checkbox" aria-label="Toggle 24 hour format" />
        <button id="reset" class="secondary">Reset defaults</button>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite" aria-relevant="additions removals">
      <!-- Cards injected here -->
    </section>

    <footer>
      Tip: Use IANA timezone names. See list at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
    </footer>
  </main>

  <script>
    // Default zones
    const DEFAULT_ZONES = [
      { id: 'UTC', name: 'UTC' },
      { id: 'America/New_York', name: 'New York' },
      { id: 'Europe/London', name: 'London' },
      { id: 'Europe/Paris', name: 'Paris' },
      { id: 'Asia/Tokyo', name: 'Tokyo' },
      { id: 'Australia/Sydney', name: 'Sydney' }
    ];

    const grid = document.getElementById('grid');
    const tzInput = document.getElementById('tz-input');
    const addBtn = document.getElementById('add-btn');
    const addCommon = document.getElementById('add-common');
    const formatToggle = document.getElementById('format-toggle');
    const resetBtn = document.getElementById('reset');
    const errSpan = document.getElementById('err');
    const localZone = document.getElementById('local-zone');

    // Persisted zones in localStorage
    const STORAGE_KEY = 'multi-tz.zones';
    const HOUR24_KEY = 'multi-tz.hour24';

    function loadZones() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return DEFAULT_ZONES.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) return DEFAULT_ZONES.slice();
        return parsed;
      } catch (e) {
        return DEFAULT_ZONES.slice();
      }
    }
    function saveZones(zones) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(zones));
    }

    function loadHour24() {
      return localStorage.getItem(HOUR24_KEY) === '1';
    }
    function saveHour24(val) {
      localStorage.setItem(HOUR24_KEY, val ? '1' : '0');
    }

    let zones = loadZones();
    let use24 = loadHour24();
    formatToggle.checked = use24;

    // Helper to format time in a timezone
    function formatForZone(date, timeZone) {
      const options = {
        timeZone,
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        weekday: 'short', month: 'short', day: '2-digit',
        hour12: !use24
      };
      try {
        const fmt = new Intl.DateTimeFormat(undefined, options);
        return fmt.format(date);
      } catch (e) {
        return null;
      }
    }

    // Get offset text like UTC+02:00
    function offsetForZone(timeZone, date = new Date()) {
      try {
        // compute by comparing localised hours in UTC and zone
        const tzDate = new Date(date.toLocaleString('en-US', { timeZone }));
        const diffMinutes = (tzDate.getTime() - date.getTime()) / 60000;
        const sign = diffMinutes >= 0 ? '+' : '-';
        const abs = Math.abs(diffMinutes);
        const hours = String(Math.floor(abs / 60)).padStart(2,'0');
        const mins = String(abs % 60).padStart(2,'0');
        return `UTC${sign}${hours}:${mins}`;
      } catch (e) {
        return '';
      }
    }

    // Create card element
    function createCard(zoneId, displayName) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.zone = zoneId;

      const title = document.createElement('div');
      title.className = 'tz-name';
      title.textContent = displayName || zoneId;

      const info = document.createElement('div');
      info.className = 'tz-offset small tz-offset';
      info.textContent = offsetForZone(zoneId);

      const timeEl = document.createElement('div');
      timeEl.className = 'time';
      timeEl.textContent = '...';

      const row = document.createElement('div');
      row.style.display = 'flex'; row.style.justifyContent = 'space-between'; row.style.marginTop = '10px'; row.style.alignItems = 'center';

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = 'Remove';
      removeBtn.title = 'Remove this timezone';
      removeBtn.onclick = () => {
        zones = zones.filter(z => z.id !== zoneId);
        saveZones(zones);
        render();
      };

      row.appendChild(info);
      row.appendChild(removeBtn);

      card.appendChild(title);
      card.appendChild(timeEl);
      card.appendChild(row);

      return { card, timeEl, info };
    }

    // Render all cards
    function render() {
      grid.innerHTML = '';
      // local zone name
      localZone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      zones.forEach(z => {
        const { card, timeEl, info } = createCard(z.id, z.name);
        grid.appendChild(card);
        // attach references for updating
        card._timeEl = timeEl;
        card._info = info;
        card._zoneId = z.id;
      });
      updateAll(); // immediate update
    }

    // Update times every second
    function updateAll() {
      const now = new Date();
      const cards = grid.querySelectorAll('.card');
      cards.forEach(card => {
        const tz = card._zoneId;
        const formatted = formatForZone(now, tz);
        if (formatted === null) {
          card._timeEl.textContent = 'Invalid timezone';
          card._info.textContent = '';
        } else {
          card._timeEl.textContent = formatted;
          card._info.textContent = offsetForZone(tz, now);
        }
      });
    }

    // Validate timezone by trying Intl
    function isValidTZ(tz) {
      try {
        new Intl.DateTimeFormat('en-US', { timeZone: tz });
        return true;
      } catch (e) {
        return false;
      }
    }

    addBtn.addEventListener('click', () => {
      const tz = tzInput.value.trim();
      if (!tz) { errSpan.textContent = 'Enter a timezone name'; setTimeout(()=>errSpan.textContent='',3000); return; }
      if (zones.find(z => z.id === tz)) { errSpan.textContent = 'Already added'; setTimeout(()=>errSpan.textContent='',2000); return; }
      if (!isValidTZ(tz)) { errSpan.textContent = 'Invalid timezone name'; setTimeout(()=>errSpan.textContent='',3000); return; }
      zones.push({ id: tz, name: tz });
      saveZones(zones);
      tzInput.value = '';
      render();
    });

    // Add common set (safe)
    addCommon.addEventListener('click', () => {
      const common = [
        { id: 'America/Los_Angeles', name: 'Los Angeles' },
        { id: 'America/Chicago', name: 'Chicago' },
        { id: 'Asia/Kolkata', name: 'Kolkata' },
        { id: 'Pacific/Auckland', name: 'Auckland' }
      ];
      common.forEach(c => {
        if (!zones.find(z => z.id === c.id) && isValidTZ(c.id)) zones.push(c);
      });
      saveZones(zones);
      render();
    });

    // Reset defaults
    resetBtn.addEventListener('click', () => {
      if (!confirm('Reset to default timezones?')) return;
      zones = DEFAULT_ZONES.slice();
      saveZones(zones);
      render();
    });

    // Toggle hour format
    formatToggle.addEventListener('change', (e) => {
      use24 = !!e.target.checked;
      saveHour24(use24);
      render();
    });

    // keyboard shortcut: Enter on input
    tzInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addBtn.click(); });

    // initial load
    render();
    // keep updating
    setInterval(updateAll, 1000);
  </script>
</body>
</html>
